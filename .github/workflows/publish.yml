name: Publish package

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      version:
        description: Package version to publish
        required: true
        type: string

permissions:
  contents: read
  id-token: write

concurrency:
  group: npm-publish-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: "24"
          registry-url: "https://registry.npmjs.org"
          package-manager-cache: false

      - run: npm ci

      - name: Verify package version
        env:
          REQUESTED_VERSION: ${{ github.event_name == 'release' && github.event.release.tag_name || inputs.version }}
        run: |
          package_version="$(node --print "require('./packages/position-svg-generator/package.json').version")"
          if [[ "$package_version" != "$REQUESTED_VERSION" ]]; then
            echo "Package version $package_version does not match requested version $REQUESTED_VERSION"
            exit 1
          fi

      - run: npm test --workspace packages/position-svg-generator

      - run: npm publish --workspace packages/position-svg-generator --access public
