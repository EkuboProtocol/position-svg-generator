name: Checks

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

concurrency:
  group: checks-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read

jobs:
  checks:
    name: Format, lint, types, tests and builds
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - run: npm ci

      # The demo app and the type-aware lint resolve the library through its
      # built dist, so it is built first.
      - name: Build library
        run: npm run build --workspace packages/position-svg-generator

      # These checks only read the sources and the built library, so they run
      # side by side. Every one runs to the end even when another fails, so
      # one push reports every kind of problem at once.
      - parallel:
          - name: Format
            run: npm run format:check

          - name: Lint
            run: npm run lint

          - name: Type check
            run: npm run check-ts

          - name: Snapshot tests
            run: npm test --workspace packages/position-svg-generator

      # The demo build type-checks the demo app again and writes the same
      # incremental build files as the type check, so it runs afterwards.
      - name: Build demo app
        if: ${{ !cancelled() }}
        run: npm run build --workspace packages/demo-app
